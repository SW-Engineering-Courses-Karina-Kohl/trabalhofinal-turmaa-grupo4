# Build sem imagem Maven (útil quando o Docker Hub dá timeout):
#   mvn clean package
#   docker compose -f docker-compose.local.yml up --build
services:
  app-escolar:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        TOMCAT_IMAGE: mirror.gcr.io/library/tomcat:10.1-jdk17-temurin
    ports:
      - "8080:8080"
    container_name: servlet-container
